<title>THE DESK // HUD</title>
<style>
/* Committed world: a holographic HUD (Jarvis/targeting-display). Thin cyan wireframe, radial
   gauges, rotating rings, corner brackets. Dark navy void. CSP-safe, all graphics on canvas. */
:root{ --c:#5eeaff; --c2:#9df6ff; --dim:#2a5f74; --hot:#ff9e57; --good:#59f6c0; --bad:#ff6b8a;
  --ink:#cfeeffcc; --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:system-ui,"Segoe UI",sans-serif; }
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;min-height:100vh;font-family:var(--mono);color:var(--ink);overflow:hidden;
  background:radial-gradient(130% 100% at 50% 40%,#071722 0%,#040d15 55%,#01060a 100%)}
.stage{position:relative;width:100vw;height:100vh}
.grid{position:absolute;inset:0;opacity:.5;
  background:linear-gradient(rgba(94,234,255,.05) 1px,transparent 1px) 0 0/44px 44px,
   linear-gradient(90deg,rgba(94,234,255,.05) 1px,transparent 1px) 0 0/44px 44px;
  -webkit-mask:radial-gradient(120% 90% at 50% 45%,#000 40%,transparent 85%);
  mask:radial-gradient(120% 90% at 50% 45%,#000 40%,transparent 85%)}
/* corner brackets */
.brk{position:absolute;width:34px;height:34px;border:2px solid var(--c);opacity:.55;filter:drop-shadow(0 0 5px var(--c))}
.brk.tl{top:20px;left:20px;border-right:0;border-bottom:0}
.brk.tr{top:20px;right:20px;border-left:0;border-bottom:0}
.brk.bl{bottom:20px;left:20px;border-right:0;border-top:0}
.brk.br{bottom:20px;right:20px;border-left:0;border-top:0}
.top{position:absolute;top:26px;left:0;right:0;text-align:center;z-index:5}
.top .t{font-family:var(--sans);font-weight:800;letter-spacing:.5em;font-size:15px;color:var(--c2);
  text-shadow:0 0 14px var(--c)}
.top .s{font-size:10px;letter-spacing:.3em;color:var(--dim);margin-top:5px}
main{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:center;
  padding:0 clamp(16px,4vw,64px)}
canvas{display:block;width:100%;height:auto}
.side{display:flex;flex-direction:column;gap:20px}
.read{border:1px solid rgba(94,234,255,.2);border-radius:10px;padding:12px 15px;
  background:rgba(10,30,42,.35);backdrop-filter:blur(4px);position:relative}
.read::before{content:"";position:absolute;left:12px;top:0;width:26px;height:2px;background:var(--c);box-shadow:0 0 8px var(--c)}
.read h3{margin:0 0 8px;font-size:9px;letter-spacing:.28em;color:var(--dim);font-weight:400}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0;font-size:12px;color:var(--ink)}
.kv b{color:var(--c2);font-weight:700} .kv .big{font-size:22px;font-family:var(--sans)}
.log{font-size:11px;line-height:1.6;height:112px;overflow:hidden}
.log .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.9}
.log .a{color:var(--c2)} .log .d{color:var(--dim)} .log .g{color:var(--good)} .log .h{color:var(--hot)}
.centerwrap{position:relative;text-align:center}
.verd{position:absolute;left:0;right:0;bottom:2%;font-family:var(--sans);font-weight:850;font-size:20px;
  letter-spacing:.08em;text-shadow:0 0 20px currentColor}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
@media(max-width:900px){main{grid-template-columns:1fr}.side{display:none}}
</style>

<div class="stage">
  <div class="grid"></div>
  <div class="brk tl"></div><div class="brk tr"></div><div class="brk bl"></div><div class="brk br"></div>
  <div class="top"><div class="t">THE&nbsp;DESK</div><div class="s">HERMES CORE · RITHMIC · MBO DEPTH · <span id="clk">--:--:--</span></div></div>

  <main>
    <div class="side">
      <div class="read"><h3>ACCOUNT // LUCID FLEX 50K</h3>
        <div class="kv"><span>BALANCE</span><b class="big" id="bal">$52,340</b></div>
        <div class="kv"><span>DAY P&L</span><b id="daypl">+$0</b></div>
        <div class="kv"><span>AVAIL DD</span><b id="add">$2,340</b></div>
        <div class="kv"><span>1.0 RISK</span><b id="risk">$200</b></div>
      </div>
      <div class="read"><h3>DEPTH // MBP-10</h3><canvas id="depth" width="300" height="150"></canvas></div>
    </div>

    <div class="centerwrap">
      <canvas id="core" width="520" height="520"></canvas>
      <div class="verd" id="verd" style="color:var(--hot)">EVALUATING</div>
    </div>

    <div class="side">
      <div class="read"><h3>POSITION</h3><div id="posbox" style="color:var(--dim);font-size:12px">FLAT — awaiting canon</div></div>
      <div class="read"><h3>HERMES COMMS</h3><div class="log" id="log"></div></div>
      <div class="read"><h3>PRICE // MNQ 1M</h3><canvas id="chart" width="300" height="96"></canvas></div>
    </div>
  </main>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id),RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
const CO={c:"#5eeaff",c2:"#9df6ff",dim:"#2a5f74",hot:"#ff9e57",good:"#59f6c0",bad:"#ff6b8a"};
const hx=(h,a)=>{h=h.replace("#","");return`rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`;};

/* ---- central core: rotating agent ring + R-progress arc ---- */
const core=$("core"),g=core.getContext("2d");
const AG=["STRUCTURE","ORDER FLOW","SETUP","RISK"];let agState=[0,0,0,0],rot=0,rProg=0,coreGlow=0,pulseR=0;
function drawCore(){const W=core.width,H=core.height,cx=W/2,cy=H/2;g.clearRect(0,0,W,H);
  if(!RM)rot+=.003;
  // outer rotating ticks
  g.strokeStyle=hx(CO.c,.25);g.lineWidth=1;
  for(let i=0;i<72;i++){const a=rot+i/72*Math.PI*2,r1=W*.46,r2=i%6===0?W*.43:W*.445;
    g.beginPath();g.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);g.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);g.stroke();}
  // static rings
  [.40,.30,.19].forEach((r,i)=>{g.beginPath();g.arc(cx,cy,W*r,0,7);g.strokeStyle=hx(CO.c,.14+i*.04);g.lineWidth=1;g.stroke();});
  // R-progress arc (0..3R)
  const a0=-Math.PI/2,a1=a0+rProg/3*Math.PI*2;
  g.beginPath();g.arc(cx,cy,W*.40,a0,a1);g.strokeStyle=rProg>0?CO.good:CO.hot;g.lineWidth=4;
  g.shadowBlur=14;g.shadowColor=rProg>0?CO.good:CO.hot;g.stroke();g.shadowBlur=0;
  // agent nodes on the .30 ring, counter-rotating
  AG.forEach((name,i)=>{const a=-rot*1.4-Math.PI/2+i/AG.length*Math.PI*2,x=cx+Math.cos(a)*W*.30,y=cy+Math.sin(a)*W*.30;
    const on=agState[i];g.beginPath();g.moveTo(cx,cy);g.lineTo(x,y);g.strokeStyle=hx(CO.c,on>.05?.3+on*.4:.1);g.lineWidth=on>.05?1.6:.8;g.stroke();
    agState[i]*=.95;g.beginPath();g.arc(x,y,on>.1?9:6,0,7);g.fillStyle=on>.1?hx(CO.good,.9):hx(CO.c,.5);
    if(on>.1){g.shadowBlur=12;g.shadowColor=CO.good;}g.fill();g.shadowBlur=0;
    g.fillStyle=hx(CO.c2,.8);g.font="8px "+MONO;g.textAlign="center";
    const lx=cx+Math.cos(a)*W*.30*1.24,ly=cy+Math.sin(a)*W*.30*1.24;g.fillText(name,lx,ly);});
  // pulse rings on verdict
  if(pulseR>0){g.beginPath();g.arc(cx,cy,W*.19+pulseR*W*.3,0,7);g.strokeStyle=hx(CO.good,Math.max(0,.6-pulseR*.6));g.lineWidth=2;g.stroke();pulseR+=.02;if(pulseR>1)pulseR=0;}
  // core
  coreGlow*=.95;g.beginPath();g.arc(cx,cy,W*.13,0,7);g.fillStyle=hx(CO.c,.06);g.fill();
  g.beginPath();g.arc(cx,cy,W*.13,0,7);g.strokeStyle=hx(CO.c,.5+coreGlow*.5);g.lineWidth=2;g.shadowBlur=10+coreGlow*20;g.shadowColor=CO.c;g.stroke();g.shadowBlur=0;
  g.fillStyle=CO.c2;g.font="800 22px "+SANS;g.textAlign="center";g.textBaseline="middle";g.fillText("H",cx,cy-6);
  g.fillStyle=hx(CO.c,.7);g.font="8px "+MONO;g.fillText("HERMES CORE",cx,cy+14);
  // big P&L readout under core
  g.fillStyle=day>=0?CO.good:CO.bad;g.font="800 15px "+SANS;g.fillText((day>=0?"+$":"-$")+Math.abs(Math.round(day)).toLocaleString(),cx,cy+W*.13+18);}
const MONO='ui-monospace,Menlo,monospace',SANS='system-ui,sans-serif';

/* ---- depth mini ---- */
const dp=$("depth"),dc=dp.getContext("2d");let dom=[];(function(){for(let i=0;i<11;i++)dom.push({sz:Math.random()*.5+.15,wall:false});dom[3].sz=1;dom[3].wall=true;})();
function drawDepth(){const W=dp.width,H=dp.height,n=dom.length,rh=H/n,mid=5;dc.clearRect(0,0,W,H);
  for(let i=0;i<n;i++){const d=dom[i];d.sz=Math.max(.1,Math.min(1,d.sz+(Math.random()-.5)*.05));const ask=i<mid,w=(W-8)*d.sz,y=i*rh;
    dc.fillStyle=hx(ask?CO.bad:CO.good,.15+d.sz*.5);dc.fillRect(4,y+.5,w,rh-1);
    if(d.wall){dc.strokeStyle=CO.hot;dc.lineWidth=1;dc.strokeRect(4,y+.5,w,rh-1);dc.fillStyle=CO.hot;dc.font="7px "+MONO;dc.textAlign="right";dc.fillText("WALL",W-2,y+rh/2+2);}}}

/* ---- price mini ---- */
const ch=$("chart"), px=ch.getContext("2d");let pts=[],price=20355.25;
(function(){let p=20352;for(let i=0;i<40;i++){p+=(Math.random()-.5)*3;pts.push(p);}price=p;})();
function pushP(v){pts.push(v);if(pts.length>40)pts.shift();price=v;}
function drawChart(){const W=ch.width,H=ch.height,p=6;px.clearRect(0,0,W,H);const lo=Math.min(...pts),hi=Math.max(...pts)+.001;
  const X=i=>p+i/(pts.length-1)*(W-2*p),Y=v=>p+(hi-v)/(hi-lo)*(H-2*p);
  px.beginPath();pts.forEach((v,i)=>i?px.lineTo(X(i),Y(v)):px.moveTo(X(i),Y(v)));px.strokeStyle=CO.c;px.lineWidth=1.5;px.shadowBlur=6;px.shadowColor=CO.c;px.stroke();px.shadowBlur=0;
  px.fillStyle=CO.c2;px.beginPath();px.arc(X(pts.length-1),Y(price),2.4,0,7);px.fill();}

/* ---- state + loop ---- */
let bal=2340,day=0,tr=0,wd=0;
const money=n=>(n<0?"-$":"+$")+Math.abs(Math.round(n)).toLocaleString(),dol=n=>"$"+Math.round(n).toLocaleString();
const avail=()=>bal,base=()=>200+75*Math.max(0,Math.floor((avail()-3000)/1000));
function acct(){$("bal").textContent=dol(50000+bal);$("daypl").textContent=money(day);$("daypl").style.color=day>=0?"var(--good)":"var(--bad)";$("add").textContent=dol(avail());$("risk").textContent=dol(base());}
const et=()=>new Date().toTimeString().slice(0,8),sleep=ms=>new Promise(r=>setTimeout(r,RM?Math.min(ms,90):ms));
function log(a,m,cls){const el=document.createElement("div");el.className="l";el.innerHTML=`<span class="d">${et()}</span> <span class="a">${a}</span> <span class="${cls||''}">${m}</span>`;const L=$("log");L.appendChild(el);while(L.children.length>6)L.removeChild(L.firstChild);}
function verd(t){const v=$("verd");v.textContent=t;v.style.color=t==="TRADE"?"var(--good)":(t==="EVALUATING"?"var(--hot)":"var(--dim)");}

async function meander(n){for(let i=0;i<n;i++){pushP(price+(Math.random()-.5)*2.4);await sleep(380);}}
async function cycle(){
  agState=[0,0,0,0];rProg=0;verd("EVALUATING");$("posbox").textContent="FLAT — awaiting canon";await meander(3);
  const stop=12.5,conv=1.5,e=Math.round(price*4)/4,rd=Math.min(2,conv)*base(),sz=Math.min(40,Math.round(rd/(stop*2)));
  const msgs=[["STRUCTURE","wall behind NO · ahead 6.2 · room 3.8 · 3/4"],["ORDER FLOW","ASIA aligned · tape clean · stack ×1.5"],["SETUP","B2 · score 3 · conviction 1.5"],["RISK",`stop 12.5 · 1.5→${dol(rd)} · ${sz} micros`]];
  for(let i=0;i<4;i++){agState[i]=1;coreGlow=1;log(msgs[i][0],msgs[i][1],"a");await sleep(720);}
  await sleep(260);pulseR=.001;coreGlow=1;verd("TRADE");log("HERMES",`VERDICT>TRADE long ×${sz} @ ${e.toFixed(2)}`,"g");await sleep(480);
  log("HERMES",`python api · FILLED ${e.toFixed(2)} · bracket live`,"g");
  $("posbox").innerHTML=`<b style="color:var(--c2)">LONG MNQ ×${sz}</b><br>entry ${e.toFixed(2)}<br>stop ${(e-stop).toFixed(2)} · tgt ${(e+3*stop).toFixed(2)}`;
  const Rs=RM?[3]:[.3,.8,.5,1.3,1.8,1.5,2.2,2.7,3];
  for(const R of Rs){rProg=R;pushP(e+R*stop+(Math.random()-.5)*1.2);await sleep(540);}
  const pnl=3*rd;day+=pnl;bal+=pnl;tr++;acct();log("HERMES",`TARGET +3.0R · closed ${money(pnl)}`,"g");
  verd("FLAT");rProg=0;$("posbox").textContent="FLAT — awaiting canon";await sleep(1100);
  if(bal>=6000){bal-=2000;wd+=2000;acct();log("HERMES",`PAYOUT $2,000 · Build-6 · banked ${dol(wd)}`,"h");await sleep(1000);}}
async function loop(){acct();log("SYSTEM","hermes core online · london routed · spine armed","");while(true)await cycle();}

function raf(){drawCore();drawDepth();drawChart();requestAnimationFrame(raf);}requestAnimationFrame(raf);
setInterval(()=>$("clk").textContent=new Date().toUTCString().slice(17,25),1000);
loop();
</script>
