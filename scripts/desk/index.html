<!doctype html><html><head><meta charset="utf-8">
<title>THE DESK</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
 --bg:#0B0E13; --panel:#11151C; --panel2:#151A23; --rule:#1E252F;
 --ink:#DDE3EC; --ink2:#8B97A8; --dim:#5A6675;
 --acc:#4ADE9B; --acc2:#5B9DFF; --warn:#F2B44C; --loss:#F26B5B;
 --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
 font:13px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
 -webkit-font-smoothing:antialiased;overflow:hidden}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#top{height:46px;display:flex;align-items:center;gap:18px;padding:0 18px;
 border-bottom:1px solid var(--rule);background:var(--panel)}
.brand{font-weight:650;letter-spacing:.22em;font-size:12px}
.chip{font-size:10px;letter-spacing:.12em;text-transform:uppercase;
 padding:3px 9px;border:1px solid var(--rule);border-radius:2px;color:var(--ink2)}
.chip.on{border-color:var(--acc);color:var(--acc)}
.chip.win{border-color:var(--warn);color:var(--warn)}
#top .sp{flex:1}
#clock{font-family:var(--mono);color:var(--ink2);font-size:12px}
#kill{background:transparent;border:1px solid var(--loss);color:var(--loss);
 font:inherit;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
 padding:5px 12px;border-radius:2px;cursor:pointer}
#kill:hover{background:var(--loss);color:#000}
#kill.armed{background:var(--loss);color:#000;font-weight:700}
#grid{display:grid;grid-template-columns:300px 1fr 320px;gap:1px;
 background:var(--rule);height:calc(100% - 46px)}
.col{background:var(--bg);overflow-y:auto;padding:14px;display:flex;
 flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:12px 14px}
.card h3{margin:0 0 10px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
 color:var(--dim);font-weight:500;display:flex;justify-content:space-between}
.big{font-family:var(--mono);font-size:26px;letter-spacing:-.02em;line-height:1.1}
.sub{font-size:11px;color:var(--ink2);margin-top:3px}
.kv{display:flex;justify-content:space-between;padding:5px 0;
 border-bottom:1px solid var(--panel2);font-size:12px}
.kv:last-child{border:0}
.kv span:first-child{color:var(--ink2)} .kv span:last-child{font-family:var(--mono)}
.up{color:var(--acc)} .down{color:var(--loss)} .flat{color:var(--ink2)}
#feed{display:flex;flex-direction:column;gap:0}
.ev{border-left:2px solid var(--rule);padding:11px 0 11px 14px;margin-bottom:2px;
 animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ev .hd{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.ag{font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;
 border-radius:2px;font-weight:600}
.ag.thesis{background:#1B2E4A;color:#7FB3FF}
.ag.trigger{background:#123528;color:var(--acc)}
.ag.manage{background:#3A2E12;color:var(--warn)}
.ag.exec{background:#2E1B33;color:#C98BE0}
.ag.sys{background:#1C222B;color:var(--dim)}
.cid{font-family:var(--mono);font-size:12px;color:var(--ink)}
.tm{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:auto}
.verdict{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.v-take{color:var(--acc)} .v-pass{color:var(--dim)} .v-hold{color:var(--ink2)}
.say{font-size:12.5px;color:var(--ink2);line-height:1.55;max-width:74ch}
.ev.take{border-left-color:var(--acc)} .ev.fill{border-left-color:var(--acc2)}
.ev.exitw{border-left-color:var(--acc)} .ev.exitl{border-left-color:var(--loss)}
.ev.manage{border-left-color:var(--warn)} .ev.thesis{border-left-color:#5B9DFF}
.spark{height:44px;width:100%;display:block}
.fun{display:flex;gap:6px;margin-top:8px}
.fun div{flex:1;text-align:center;padding:7px 4px;background:var(--panel2);border-radius:2px}
.fun b{display:block;font-family:var(--mono);font-size:17px}
.fun span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.empty{color:var(--dim);font-size:12px;padding:20px 0;text-align:center}
::-webkit-scrollbar{width:8px} ::-webkit-scrollbar-thumb{background:var(--rule);border-radius:4px}
</style></head><body>
<div id="top">
  <span class="brand">THE DESK</span>
  <span class="chip" id="c-run">—</span>
  <span class="chip" id="c-win">—</span>
  <span class="chip" id="c-chop">—</span>
  <span class="sp"></span>
  <span id="clock" class="mono">--:--</span>
  <button id="kill">KILL</button>
</div>
<div id="grid">
  <div class="col">
    <div class="card"><h3>Day P&amp;L</h3>
      <div class="big" id="pnl">+0.00<span style="font-size:14px">R</span></div>
      <div class="sub" id="pnlpts">0 pts · 0 trades</div>
      <svg class="spark" id="eq" viewBox="0 0 300 44" preserveAspectRatio="none"></svg>
    </div>
    <div class="card"><h3>Position</h3><div id="pos"><div class="empty">flat</div></div></div>
    <div class="card"><h3>Session</h3>
      <div class="kv"><span>day</span><span id="s-day">—</span></div>
      <div class="kv"><span>window</span><span id="s-win">—</span></div>
      <div class="kv"><span>chop</span><span id="s-chop">—</span></div>
      <div class="kv"><span>range</span><span id="s-rng">—</span></div>
    </div>
  </div>
  <div class="col"><div class="card" style="flex:1">
    <h3>Agent comms <span id="c-n">0 events</span></h3>
    <div id="feed"><div class="empty">waiting for the stack…</div></div>
  </div></div>
  <div class="col">
    <div class="card"><h3>Decision funnel</h3>
      <div class="fun">
        <div><b id="f-c">0</b><span>cands</span></div>
        <div><b id="f-p">0</b><span>passed</span></div>
        <div><b id="f-t">0</b><span>taken</span></div>
        <div><b id="f-f">0</b><span>filled</span></div>
      </div>
      <div class="sub" id="f-rate" style="margin-top:10px">—</div>
    </div>
    <div class="card"><h3>Closed trades</h3><div id="trades"><div class="empty">none yet</div></div></div>
    <div class="card"><h3>Stack</h3>
      <div class="kv"><span>tv-thesis</span><span id="v-th">—</span></div>
      <div class="kv"><span>tv-trigger</span><span id="v-tr">—</span></div>
      <div class="kv"><span>tv-manage</span><span id="v-mg">—</span></div>
      <div class="kv"><span>model</span><span id="v-md">—</span></div>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
let S={cands:0,pass:0,take:0,fill:0,R:0,pts:0,trades:[],eq:[0],pos:null,n:0};
const num=(v,d=2)=>(v>=0?'+':'')+Number(v).toFixed(d);
const esc=s=>String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function agentOf(r){
  const t=r.row;
  if(t==='thesis'||t==='thesis_refire')return['thesis','TV-THESIS'];
  if(t==='trigger'||t==='candidate_gated')return['trigger','TV-TRIGGER'];
  if(t==='manage')return['manage','TV-MANAGE'];
  if(t==='fill'||t==='exit'||t==='limit_placed')return['exec','EXECUTION'];
  return['sys','ORCHESTRATOR'];
}
function verdictOf(r){
  const o=r.output||{}; const d=String(r.decision||o.decision||o.action||'');
  return d;
}
function saidOf(r){
  const o=r.output||{};
  return o.reason||o.reasoning||r.reason||r.note||r.finding||r.instruction||'';
}
function push(r){
  S.n++; $('c-n').textContent=S.n+' events';
  const feed=$('feed'); if(feed.querySelector('.empty'))feed.innerHTML='';
  const [cls,label]=agentOf(r); const v=verdictOf(r); const said=saidOf(r);
  if(r.row==='trigger'){S.cands++; if(v.startsWith('take'))S.take++; else S.pass++;}
  if(r.row==='fill'){S.fill++;
    S.pos={side:r.side||r.position,entry:r.entry??r.fill_price,stop:r.stop,
           cid:r.candidate_id,conv:r.conviction||r.size_label};}
  if(r.row==='exit'){
    const R=r.r_blended??r.r_multiple??r.r_result??0;
    S.R+=R; S.eq.push(S.R); S.pos=null;
    let pts=0;const e=r.entry,sg=/long|buy/i.test(String(r.side))?1:-1;
    (r.legs||[]).forEach(L=>{const f=/75/.test(L.leg)?.75:/25/.test(L.leg)?.25:/50/.test(L.leg)?.5:1;
      if(L.price!=null)pts+=f*sg*(L.price-(L.entry??e));});
    S.pts+=pts;
    S.trades.push({cid:r.candidate_id,R,pts,side:r.side});
    renderTrades();
  }
  if(r.row==='run_header'){
    const av=r.agent_versions||{};
    $('v-th').textContent=av['tv-thesis']||'—';
    $('v-tr').textContent=av['tv-trigger']||'—';
    $('v-mg').textContent=av['tv-manage']||'—';
    $('v-md').textContent=r.model||'sonnet';
  }
  if(r.chop_state||((r.output||{}).chop_state)){}
  const el=document.createElement('div');
  let k=cls;
  if(r.row==='exit')k=(r.r_blended??0)>=0?'exitw':'exitl';
  if(r.row==='trigger'&&v.startsWith('take'))k='take';
  if(r.row==='fill')k='fill';
  el.className='ev '+k;
  const vc=v.startsWith('take')?'v-take':v.startsWith('pass')?'v-pass':'v-hold';
  el.innerHTML=`<div class="hd">
      <span class="ag ${cls}">${label}</span>
      ${r.candidate_id?`<span class="cid">${esc(r.candidate_id)}</span>`:''}
      ${v?`<span class="verdict ${vc}">${esc(v)}</span>`:''}
      ${r.row==='exit'?`<span class="verdict ${(r.r_blended??0)>=0?'v-take':'v-pass'}">${num(r.r_blended??0)}R</span>`:''}
      <span class="tm">${esc(r.minute||r.decision_minute||r._day||'')}</span></div>
    ${said?`<div class="say">${esc(said)}</div>`:''}`;
  feed.prepend(el);
  while(feed.children.length>140)feed.lastChild.remove();
  render();
}
function renderTrades(){
  const t=$('trades');
  if(!S.trades.length){t.innerHTML='<div class="empty">none yet</div>';return;}
  t.innerHTML=S.trades.slice(-9).reverse().map(x=>
    `<div class="kv"><span>${esc(x.cid)}</span>
     <span class="${x.R>=0?'up':'down'}">${num(x.R)}R · ${num(x.pts,0)}pt</span></div>`).join('');
}
function render(){
  $('pnl').innerHTML=num(S.R)+'<span style="font-size:14px">R</span>';
  $('pnl').className='big '+(S.R>0?'up':S.R<0?'down':'flat');
  $('pnlpts').textContent=`${num(S.pts,0)} pts · ${S.trades.length} trades`;
  $('f-c').textContent=S.cands; $('f-p').textContent=S.pass;
  $('f-t').textContent=S.take;  $('f-f').textContent=S.fill;
  $('f-rate').textContent=S.cands?`${Math.round(100*S.pass/S.cands)}% declined — selection is the edge`:'—';
  const p=$('pos');
  p.innerHTML=S.pos?`<div class="kv"><span>${esc(S.pos.side||'')} ${esc(S.pos.cid||'')}</span>
      <span>${esc(S.pos.conv||'')}</span></div>
    <div class="kv"><span>entry</span><span>${S.pos.entry??'—'}</span></div>
    <div class="kv"><span>stop</span><span>${S.pos.stop??'—'}</span></div>`
   :'<div class="empty">flat</div>';
  // equity sparkline
  const e=S.eq,w=300,h=44,mn=Math.min(...e,0),mx=Math.max(...e,0.1),sp=(mx-mn)||1;
  const pts=e.map((v,i)=>`${(i/(Math.max(e.length-1,1)))*w},${h-((v-mn)/sp)*(h-6)-3}`).join(' ');
  $('eq').innerHTML=`<polyline points="${pts}" fill="none" stroke="${S.R>=0?'#4ADE9B':'#F26B5B'}" stroke-width="1.5"/>`;
}
function meta(r){
  if(r._day)$('s-day').textContent=r._day;
  const w=(r.window||'').split(' ')[0];
  if(w){$('s-win').textContent=w;$('c-win').textContent=w;}
  const cs=r.chop_state||(r.output||{}).chop_state;
  if(cs&&cs.state){
    $('s-chop').textContent=cs.state;
    $('c-chop').textContent=cs.state;
    $('c-chop').className='chip '+(cs.state==='CHOP'?'win':'on');
    if(cs.range_low!=null)$('s-rng').textContent=`${cs.range_low}–${cs.range_high}`;
  }
}
fetch('/api/state').then(r=>r.json()).then(d=>{
  $('c-run').textContent=d.run;
  if(d.halted)$('kill').classList.add('armed');
  (d.rows||[]).forEach(r=>{meta(r);push(r);});
});
const es=new EventSource('/api/stream');
es.onmessage=m=>{const r=JSON.parse(m.data);meta(r);push(r);};
setInterval(()=>{$('clock').textContent=new Date().toISOString().slice(11,19)+' UTC';},1000);
$('kill').onclick=()=>{
  const armed=$('kill').classList.contains('armed');
  if(!armed&&!confirm('HALT the stack? It will stop before its next decision.'))return;
  fetch(armed?'/api/resume':'/api/halt',{method:'POST'}).then(()=>{
    $('kill').classList.toggle('armed');
    $('kill').textContent=armed?'KILL':'HALTED — CLICK TO RESUME';});
};
</script></body></html>
