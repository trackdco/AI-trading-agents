# Prop-firm rules used by the research simulator.
# Retrieved 2026-11-03 from the firms' help centres. Every number the simulator
# enforces is copied from those pages. Anything that was not on the page, or
# that lived only in an image the text extract dropped, is listed under
# `unconfirmed` and is NOT applied.
#
# Apex is intentionally absent.
# This file does not place orders and contains no credentials.

retrieved: "2026-11-03"

automation:
  topstep:
    bots_allowed: true
    route: "ProjectX / TopstepX API"
    hft_banned: true
    vps_vpn_remote_for_orders_banned: true
    api_works_on_live_funded: false
    sandbox: false
    api_price_usd_per_month: 29
    api_price_with_code_topstep: 14.50
    personal_device_only: true
    sources:
      - url: "https://help.topstep.com/en/articles/11187768-topstepx-api-access"
        title: "TopstepX API Access"
        page_date: "2026-09-17"
  lucid:
    bots_allowed: true
    trade_copiers_allowed: true
    news_trading:
      luciddaily: "hard breach, flat from 1 minute before through 1 minute after high-impact USD releases"
      flex_pro_direct: "allowed, not a breach"
    sources:
      - url: "https://support.lucidtrading.com/en/articles/11404728-other-trading-activities"
        title: "Other Trading Activities"
        page_date: null

# Shared clocks. Topstep publishes Central Time. Lucid's page says "EST" for
# a session that follows the exchange clock; the simulator uses America/New_York
# and flags that wording under unconfirmed.
clocks:
  topstep:
    timezone: America/Chicago
    reopen: "17:00"
    flat_by: "15:10"
    holding_past_flat_is_breach: true
    week_open: "Sunday 17:00"
    week_close: "Friday 15:10"
    source:
      url: "https://help.topstep.com/en/articles/8284206-when-and-what-products-can-i-trade"
      title: "When and What Products Can I Trade?"
      page_date: null
      retrieved: "2026-11-03"
  lucid:
    timezone: America/New_York
    reopen: "18:00"
    flat_by: "16:45"
    holding_past_flat_is_breach: false
    note: "Auto-flat at 16:45. Holding past that time does not fail the account."
    source:
      url: "https://support.lucidtrading.com/en/articles/11404729-allowed-trading-times"
      title: "Allowed Trading Times"
      page_date: "2026-08-26"
      retrieved: "2026-11-03"

