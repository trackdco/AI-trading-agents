unconfirmed:
  - id: topstep_xfa_scaling_dollar_tiers
    affects: "XFA position size by balance"
    why: "The help page says the ladder is 'shown below' and the text extract has no dollar rows. A 50K example mentions a 2-lot plan. The simulator does not apply 2/3/5 tiers."
    url: "https://help.topstep.com/en/articles/8284223-what-is-the-scaling-plan"
  - id: topstep_dll_double_cap_end_date
    affects: "XFA payout cap if a DLL was added at combine checkout"
    why: "Described as a limited-time offer starting 2026-06-02 with no end date on the page. Default cap is the standard cap, not the doubled one."
    url: "https://help.topstep.com/en/articles/8284233-topstep-payout-policy"
  - id: lucidflex_dll_dollars
    affects: "Flex daily loss limit when the checkout toggle is On"
    why: "Official pages say the DLL is optional and a soft lockout. They do not print the dollar amount. Third-party cards say $1,200 on a 50K. Not applied."
    url: "https://support.lucidtrading.com/en/articles/16226050-lucidflex-customization"
  - id: lucidflex_funded_scaling_tiers
    affects: "Flex funded contracts"
    why: "The funded page says Scaling Plan = Yes and prints only the maximum size. Tiers are not in the article. The simulator uses that maximum and flags it."
    url: "https://support.lucidtrading.com/en/articles/12945795-lucidflex-funded-account"
  - id: lucidflex_payout_fraction
    affects: "How much of a Flex payout is 50%"
    why: "The payout article says both '50% of their account balance' and '50% of Profit', each up to the cap. The simulator uses 50% of cycle profit, capped. Angus should confirm."
    url: "https://support.lucidtrading.com/en/articles/12945796-lucidflex-payouts"
  - id: lucidflex_consistency_cushion
    affects: "50% consistency add-on"
    why: "Re-fetched 2026-11-03. The example table is $1,560 against a $1,500 half on a 50K, and the same 4% step on 25K ($650 vs $625), 100K ($3,120 vs $3,000) and 150K ($4,680 vs $4,500). The page says this is an example, not a fixed dollar amount, and that the cushion is a percentage of the actual best day. Two equal days that land on exactly half the target are already '50% or less', so they pass the add-on without the cushion. The simulator uses that plain ratio."
    url: "https://support.lucidtrading.com/en/articles/12945805-lucidflex-consistency-percentage"
  - id: lucid_dollar_fees
    affects: "Eval cost and EV per attempt at Lucid"
    why: "The fees article says LucidPro and LucidDirect are a one-time fee with no activation fee, and does not print the price. Flex pricing is not in that article. EV runs with fee 0 and fee_unconfirmed set."
    url: "https://support.lucidtrading.com/en/articles/11404620-simulated-account-fees"
  - id: lucid_hours_labeled_est
    affects: "Session clock"
    why: "The page says EST. The simulator treats the clock as America/New_York so daylight time follows the exchange. Confirm with Lucid if they truly mean EST year-round."
    url: "https://support.lucidtrading.com/en/articles/11404729-allowed-trading-times"
  - id: luciddaily_100k_150k_mll
    affects: "LucidDaily 100K and 150K"
    why: "The account table's text extract dropped the max-loss cells for 100K and 150K. Those sizes are not in the simulator."
    url: "https://support.lucidtrading.com/en/articles/15997244-luciddaily-funded-account"
  - id: luciddaily_lock_and_payout
    affects: "Whether the LucidDaily intraday trail locks, and the payout schedule"
    why: "The page confirms intraday drawdown, daily payouts, no consistency, and the news blackout. It does not give a lock balance or the payout dollar rules. Payout simulation is off."
    url: "https://support.lucidtrading.com/en/articles/15997244-luciddaily-funded-account"
  - id: lucidpro_payout_table
    affects: "LucidPro funded payouts"
    why: "The payout page's 50K row did not extract into clean cells. Pro eval rules are simulated. Pro funded payouts are not."
    url: "https://support.lucidtrading.com/en/articles/12890092-lucidpro-payouts"
  - id: lucid_eval_profit_carry
    affects: "Funded starting balance after a Flex or Pro pass"
    why: "Topstep states combine profits do not carry into the XFA, and the XFA starts at $0. Lucid's pages do not say whether eval profit carries. The funded sim starts a fresh account at the account size."
    url: "https://help.topstep.com/en/articles/8284197-trading-combine-parameters"
  - id: lucid_pass_intraday
    affects: "When a Lucid eval is marked passed"
    why: "Lucid says activation is real-time, within 5–30 minutes of hitting the target. The simulator marks a pass at the session close, and a failure the moment the max-loss line is touched. A path that tags the target and then breaches the same day can disagree with the firm."
    url: "https://support.lucidtrading.com/en/articles/12945790-lucidflex-evaluation-account"

