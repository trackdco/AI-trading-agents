# config/live.yaml — OPERATIONAL settings for the LIVE CANON runner
# (scripts/canon_run.py). Runtime WIRING only; the trading RULES live in
# config/strategy.yaml and are never duplicated here.
#
# There is NO paper stage. This runs the AUTHORITATIVE canon lane (shape i,
# src/live/route_b.py::RouteBLive) off Sierra's own .scid/.depth files, DISARMED
# (zero orders) until the arming token. Sequence:
#   gates -> shadow run (zero orders) -> gate_report PASS -> arming token -> live on funded
#   * disarmed        — _NoBroker; the spine evaluates + journals but cannot route an order
#   * KILL-aware      — the spine reads `paths.kill_file`; present => the spine halts
#   * alerting        — Telegram on start / stop / roll (also logged to run_log)
#   * Route-B data    — tails Sierra .scid/.depth (DTC won't serve data), roll re-point, stall

account:
  equity: 50000.0                 # funded-account equity for the spine's AccountState
                                  #   (placeholder until the DTC account read-back is wired)

archive:                          # nightly Sierra .scid/.depth offload (scripts/archive_sierra.py)
  data_dir: C:/SierraChart/Data   # Sierra Data dir (front-month .scid + MarketDepthData/*.depth)
  bucket:   nq-sierra-book        # Backblaze B2 bucket (creds from B2_KEY_ID / B2_APP_KEY env)
  manifest: output/live/archive_manifest.json   # {key: size} — makes the nightly run idempotent
  prefix:   sierra                # B2 key prefix (repointed from the old "mbo" prefix)
  root:     NQ                    # symbol root
  suffix:   "-CME"               # exchange/service tag Sierra appends to the file name
  # Register the nightly Windows task once on the VPS:
  #   python scripts/archive_sierra.py --register   (prints the schtasks command; default 17:30 CT)

paths:
  journal_dir: output/live                 # verdicts.jsonl + spine/sizing/rejects + decisions.jsonl
  kill_file:   output/live/KILL            # present => the spine halts
  run_log:     output/live/canon_run.log   # runner log (also echoed to stdout)

telegram:
  enabled: true                    # true => alerts via .env creds; false => run silent
                                   #   (the runner still logs every alert to run_log)

feed:
  sierra:                          # the on-box Route-B live data path
    data_dir: C:/SierraChart/Data  # Sierra's Data dir (front-month .scid + MarketDepthData/)
    # scid: C:/SierraChart/Data/NQU26-CME.scid   # optional explicit override; else resolved
    root: NQ                       # symbol root (data reads NQ; orders would route MNQ)
    suffix: "-CME"                 # exchange/service tag Sierra appends to the file name
    account: FUNDED                # account label on the (disarmed) spine OrderIntent
    flush_ms: 1000                 # configured Sierra flush (feed-lag report baseline)
    poll_interval_s: 1.0           # live-tail poll cadence (match the flush)
    warmup:                        # warm start before going live (day-one levels correct)
      parquet: data/reference/nq_1m_feb_jul2026.parquet
      warmup_days: 20
      # footprint: output/fp_minutes.parquet     # optional: also warm tape/CVD
